 {id:'bricks',t:'Кирпичи',f:'КИРПИЧИ',make:mkBricks,cover:cvBricks,d:'Разбей мячиком всю стену.'},
 {id:'sniper',t:'Снайпер',f:'СНАЙПЕР',make:mkSniper,cover:cvSniper,d:'Успей попасть в мишень в окне.'}];
const GBY=Object.fromEntries(GAMES.map(g=>[g.id,g]));
/* ================= UI / MENU ================= */
let state='menu',curDef=null,game=null,paused=false,L=null;
function show(id){for(const s of document.querySelectorAll('.scr'))s.classList.toggle('on',s.id===id);state=id;}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1400);}
function applySkins(){document.body.className='box'+SV.box+' table'+SV.table;FG=PH[SV.ph]||PH[0];$('#snd').textContent=SV.mute?'Звук: выкл':'Звук: вкл';}
function iconCanvas(cv,d){const c=cv.getContext('2d');c.setTransform(cv.width/320,0,0,cv.width/320,0,0);c.clearRect(0,0,320,240);
 c.translate(0,-30);c.scale(1,1.15);drawCover(c,d,1,'#2a2a52',{title:false,lw:5});}
function renderList(){const l=$('#list');l.innerHTML='';let i=0;
 for(const d of GAMES){const n=SV.own[d.id]||0;if(!n)continue;i++;
  const b=document.createElement('button');b.className='cas';b.dataset.id=d.id;
  b.innerHTML=`<span class="lab"><span class="n">${i}</span><span class="t">${d.t}</span><canvas width="96" height="72"></canvas></span>${n>1?`<span class="x2">×${n}</span>`:''}`;
  iconCanvas(b.querySelector('canvas'),d);b.onclick=()=>openCard(d,b);l.appendChild(b);}
}
function openCard(d,el){audio();curDef=d;document.querySelectorAll('.cas').forEach(c=>c.classList.toggle('pull',c===el));
 const cv=$('#ccv'),c=cv.getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,320,240);drawCover(c,d,1,'#2b2118',{lw:2});
 $('#cinfo').innerHTML=`${d.d}<br>Рекорд: <b>${SV.hi[d.id]||0}</b> · копий в коробке: ${SV.own[d.id]||1}`;
 $('#cardov').classList.add('on');beep(330,.04,'triangle');}
function closeCard(){$('#cardov').classList.remove('on');document.querySelectorAll('.cas').forEach(c=>c.classList.remove('pull'));}
$('#bback').onclick=closeCard;
$('#cardov').addEventListener('click',e=>{if(e.target.id==='cardov')closeCard();});
$('#bload').onclick=()=>{audio();closeCard();startLoad(curDef);};
$('#snd').onclick=()=>{SV.mute=!SV.mute;save();applySkins();if(!SV.mute){audio();beep(880,.06);}};
$('#fs').onclick=()=>{const d=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else(d.requestFullscreen||d.webkitRequestFullscreen).call(d);}catch(e){toast('Этот браузер не умеет весь экран');}};
/* ================= SHOP ================= */
const SKINS={box:['Обычная картонная','Старая тёмная','Красная из-под конфет','Синяя из-под ботинок'],table:['Дубовый стол','Светлая сосна','Клеёнка в клетку'],ph:['Чёрно-белый (как на БК)','Зелёный экран','Янтарный экран']};
function mainShop(){const it=[{sec:'Кассеты'}];
 for(const d of [...GAMES].sort((a,b)=>(SV.own[a.id]?1:0)-(SV.own[b.id]?1:0)))it.push({id:'c_'+d.id,n:`Кассета «${d.t}»`,d:(SV.own[d.id]?`Уже в коробке (${SV.own[d.id]} шт.) — можно взять ещё. `:'НОВАЯ ИГРА! ')+d.d,f(){SV.own[d.id]=(SV.own[d.id]||0)+1;renderList();},ok:`Кассета «${d.t}» в коробке!`});
 it.push({sec:'Для всех игр'},
  {id:'life',n:'+1 жизнь во всех играх',d:()=>`Сейчас жизней на старте: ${startLives()}`,f(){SV.bonus++;if(game&&'lives' in game)game.lives++;},ok:'Жизнь добавлена!'},
  {id:'unlife',n:'Вернуть обычные 3 жизни',d:'Если хочется посложнее',f(){SV.bonus=0;},ok:'Снова 3 жизни'},
  {id:'easy',n:'Лёгкий режим',d:()=>SV.easy?'Сейчас ВКЛЮЧЁН — нажми, чтобы выключить':'Сейчас выключен — игры станут медленнее',f(){SV.easy=!SV.easy;},ok:'Готово!'});
 for(const k of ['box','table','ph']){it.push({sec:k==='box'?'Коробка':k==='table'?'Стол':'Экран'});
  SKINS[k].forEach((n,i)=>it.push({id:k+i,n,d:()=>SV[k]===i?'Выбрано сейчас':'Нажми, чтобы поставить',sel:()=>SV[k]===i,f(){SV[k]=i;applySkins();},ok:'Поставлено!'}));}
 return it;}
function gameShop(){const it=[{sec:'Для игры «'+curDef.t+'»'}];
 if(game&&'lives' in game)it.push({id:'g_life',n:'+1 жизнь',d:()=>`Сейчас жизней: ${game.lives}`,f(){game.lives++;if(game.over){game.over=false;}},ok:'Жизнь добавлена!'});
 (game&&game.shop||[]).forEach((s,i)=>it.push({id:'g_'+curDef.id+i,n:s.n,d:s.d,f:s.f,ok:'Готово!'}));
 return it.concat(mainShop());}
let shopMode='main';
function renderShop(){const l=$('#shopl'),items=shopMode==='game'?gameShop():mainShop();l.innerHTML='';
 for(const s of items){if(s.sec){const h=document.createElement('div');h.className='sec';h.textContent=s.sec;l.appendChild(h);continue;}
  const e=document.createElement('div');e.className='it'+(s.sel&&s.sel()?' sel':'');const cnt=SV.taken[s.id]||0;
  e.innerHTML=`<div class="tx"><div class="nm"></div><div class="ds"></div><div class="pr">Цена: 0 · бесплатно${cnt?` · взято ${cnt} раз`:''}</div></div><button>ВЗЯТЬ</button>`;
  e.querySelector('.nm').textContent=s.n;e.querySelector('.ds').textContent=typeof s.d==='function'?s.d():s.d;
  e.querySelector('button').onclick=()=>{audio();s.f();SV.taken[s.id]=cnt+1;save();beep(1046,.06);setTimeout(()=>beep(1568,.08),70);toast(s.ok||'Готово!');const y=l.scrollTop;renderShop();l.scrollTop=y;};
  l.appendChild(e);}}
function openShop(mode){audio();shopMode=mode;$('#shopt').textContent=mode==='game'?'Магазин игры':'Магазин';renderShop();$('#shopl').scrollTop=0;$('#shopov').classList.add('on');}
$('#sticker').onclick=()=>openShop('main');
$('#shopx').onclick=()=>{$('#shopov').classList.remove('on');};
/* ================= LOADING ================= */
const lcv=$('#lcv'),lctx=lcv.getContext('2d');
function startLoad(d){curDef=d;$('#lname').textContent=d.f;show('load');fitAll();noise(.08,.2);
 L={d,t0:performance.now()};playTape();}
$('#bskip').onclick=()=>{stopTape();startGame(curDef);};
function drawLoad(){
 const t=(performance.now()-L.t0)/1000,c=lctx;ctx=c;c.setTransform(2,0,0,2,0,0);c.fillStyle='#000';c.fillRect(0,0,320,240);
 if(t<TL.data){
  const lines=[[0,'БК-0010-01'],[.15,'ОЗУ 32К   ПЗУ: МОНИТОР'],[.45,'? M'],[.65,'ВВЕДИТЕ ИМЯ ФАЙЛА: '+L.d.f.slice(0,Math.max(0,Math.floor((t-.7)/.08)))],[1.5,'ПОИСК...'],
   [TL.gap,'НАЙДЕН: '+L.d.f],[TL.gap+.25,'АДРЕС=001000  ДЛИНА='+String(10000+L.d.f.length*731).padStart(6,'0')],[TL.pilot2+.2,'ЗАГРУЗКА...']];
  let y=10;for(const [at,s] of lines)if(t>=at){T(s,10,y,12);y+=18;}
  if(Math.floor(t*3)%2){ctx.fillStyle=FG;ctx.fillRect(10,y+1,8,12);}
  if(t>TL.pilot1&&t<TL.head){for(let i=0;i<3;i++){c.fillStyle=FG;c.globalAlpha=.25;c.fillRect(0,200+Math.random()*30,320,1);c.globalAlpha=1;}}
 }else{
  const p=clamp((t-TL.data)/(TL.end-TL.data),0,1);
  c.save();c.translate(16,4);c.scale(.9,.86);drawCover(c,L.d,p,FG,{tip:true,lw:1.8});c.restore();
  c.fillStyle='#000';c.fillRect(0,214,320,26);c.strokeStyle=FG;c.lineWidth=1;c.strokeRect(10.5,222.5,220,10);c.fillStyle=FG;
  for(let i=0;i<Math.floor(p*27);i++)c.fillRect(13+i*8,225,6,6);
  T(p<1?`ЗАГРУЗКА ${Math.floor(p*100)}%`:'ПУСК!',238,222,11);
 }
 if(t>=TL.total){stopTape();startGame(L.d);}
}
/* ================= GAME HOST ================= */
const gcv=$('#gcv'),gctx=gcv.getContext('2d');
function startGame(d){curDef=d;L=null;show('game');In.clear();paused=false;$('#pauseov').classList.remove('on');newGame();fitAll();}
function newGame(){game=curDef.make();game._hi=false;
 $('#bA').textContent=game.a||'A';const b=$('#bB');b.style.visibility=game.b?'visible':'hidden';b.textContent=game.b||'';fitAll();}
function endCheck(){if(game.over&&!game._hi){game._hi=true;if(game.score>(SV.hi[curDef.id]||0)){SV.hi[curDef.id]=game.score;game._new=true;save();}}}
function renderGame(){ctx=gctx;gctx.setTransform(2,0,0,2,0,0);gctx.fillStyle='#000';gctx.fillRect(0,0,320,240);game.draw();
 if(game.over){gctx.fillStyle='#000';gctx.fillRect(50,70,220,104);gctx.strokeStyle=FG;gctx.lineWidth=2;gctx.strokeRect(54,74,212,96);
  T('ИГРА ОКОНЧЕНА',160,84,16,'center');T('ОЧКИ: '+game.score,160,108,12,'center');if(game._new)T('НОВЫЙ РЕКОРД!',160,126,12,'center');
  T('НАЖМИ '+(game.a||'A')+' ИЛИ ЭКРАН',160,148,10,'center');}
 if(paused){T('ПАУЗА',160,6,12,'center');}
}
function togglePause(force){paused=force!==undefined?force:!paused;$('#pauseov').classList.toggle('on',paused&&!$('#shopov').classList.contains('on'));In.clear();}
function toBox(){stopTape();paused=false;game=null;$('#pauseov').classList.remove('on');$('#shopov').classList.remove('on');renderList();show('menu');}
$('#bpause').onclick=()=>togglePause(true);
$('#pcont').onclick=()=>togglePause(false);
$('#prst').onclick=()=>{newGame();togglePause(false);};
$('#pswap').onclick=toBox;$('#bswap').onclick=toBox;
$('#bgshop').onclick=()=>{paused=true;In.clear();openShop('game');};
$('#pshop').onclick=()=>{$('#pauseov').classList.remove('on');openShop('game');};
$('#shopx').addEventListener('click',()=>{if(state==='game'){$('#pauseov').classList.add('on');paused=true;}else renderList();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='game'&&!paused)togglePause(true);});
/* touch controls */
const dpad=$('#dpad');const padPtr=new Set();
function padDir(e){const r=dpad.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5,m=Math.hypot(dx,dy);
 let l=0,rr=0,u=0,d=0;
 if(m>.08){if(game&&game.dpad8){const a=Math.atan2(dy,dx),s=Math.round(a/(Math.PI/4));const S=((s%8)+8)%8;
   rr=[0,1,7].includes(S);d=[1,2,3].includes(S);l=[3,4,5].includes(S);u=[5,6,7].includes(S);}
  else{if(Math.abs(dx)>Math.abs(dy)){if(dx<0)l=1;else rr=1;}else{if(dy<0)u=1;else d=1;}}}
 setPad({l,r:rr,u,d});}
function setPad(o){for(const k of ['l','r','u','d']){In.set(k,'pad',o[k]);const el=dpad.querySelector(`[data-d="${k}"]`);el.classList.toggle('on',!!o[k]);}}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();audio();try{dpad.setPointerCapture(e.pointerId);}catch(_){}padPtr.add(e.pointerId);padDir(e);});
dpad.addEventListener('pointermove',e=>{if(padPtr.has(e.pointerId))padDir(e);});
const padUp=e=>{if(!padPtr.delete(e.pointerId))return;if(!padPtr.size)setPad({});};
dpad.addEventListener('pointerup',padUp);dpad.addEventListener('pointercancel',padUp);dpad.addEventListener('lostpointercapture',padUp);
for(const [id,k] of [['#bA','a'],['#bB','b']]){const el=$(id);const ids=new Set();
 el.addEventListener('pointerdown',e=>{e.preventDefault();audio();try{el.setPointerCapture(e.pointerId);}catch(_){}ids.add(e.pointerId);In.set(k,'btn',1);el.classList.add('on');
  if(k==='a'&&game&&game.over&&!paused)newGame();});
 const up=e=>{if(!ids.delete(e.pointerId))return;if(!ids.size){In.set(k,'btn',0);el.classList.remove('on');}};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
for(const el of [dpad,$('#act'),gcv])el.addEventListener('contextmenu',e=>e.preventDefault());
let cvDown=false;
const cvXY=e=>{const r=gcv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*240];};
gcv.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(!game||paused)return;if(game.over){newGame();return;}cvDown=true;const [x,y]=cvXY(e);game.tap&&game.tap(x,y);});
gcv.addEventListener('pointermove',e=>{if(cvDown&&game&&game.drag){const [x,y]=cvXY(e);game.drag(x,y);}});
addEventListener('pointerup',()=>cvDown=false);
/* ================= LAYOUT ================= */
function safe(){const c=getComputedStyle($('#sa'));return {t:parseFloat(c.paddingTop)||0,r:parseFloat(c.paddingRight)||0,b:parseFloat(c.paddingBottom)||0,l:parseFloat(c.paddingLeft)||0};}
function fitAll(){const sa=safe(),W=innerWidth-sa.l-sa.r,H0=innerHeight-sa.b,H=H0-sa.t,land=W>=H;
 const lw=Math.max(100,Math.min(W-30,(H-110)*4/3));const lc=$('#lcrt');lc.style.width=lw+'px';lc.style.height=lw*.75+'px';
 if(state!=='game')return;
 const top=($('#gtop').offsetHeight||56)-sa.t;let sw,pd;
 if(land){const side=clamp(W*.22,120,230);sw=Math.min(W-2*side-20,(H-top-30)*4/3);pd=Math.min(side-14,(H-top)*.62,230);}
 else{sw=Math.min(W-20,(H-top)*.52*4/3);const rest=H-top-sw*.75-30;pd=Math.max(110,Math.min(W*.48,rest,270));}
 const c=$('#gcrt');c.style.width=sw+'px';c.style.height=sw*.75+'px';dpad.style.width=dpad.style.height=pd+'px';
 const ab=Math.round(pd*(land?.44:.42));for(const b of [$('#bA'),$('#bB')]){const sz=b.id==='bB'?Math.round(ab*.85):ab;b.style.width=b.style.height=sz+'px';const n=Math.max(4,...b.textContent.split(/\s+/).map(w=>w.length));b.style.fontSize=Math.max(11,Math.min(sz*.2,sz*1.25/n))+'px';}}
addEventListener('resize',()=>setTimeout(fitAll,50));if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(fitAll,50));addEventListener('orientationchange',()=>setTimeout(fitAll,250));
/* ================= LOOP ================= */
let last=0;
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 try{
 if(state==='load'&&L)drawLoad();
 else if(state==='game'&&game){In.pre(dt);if(!paused&&!game.over){game.update(dt);endCheck();}else if(!paused&&game.over&&In.press('a')&&!In.src.a?.btn)newGame();In.post();renderGame();}
 }catch(err){console.error(err);}
}
applySkins();renderList();requestAnimationFrame(frame);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.__bk={get state(){return state},get game(){return game},GAMES,SV};
</script>
